[project]
name = "evekonta"
dynamic = ["version"]
description = "Local, encrypted manager for many EVE Online accounts and characters (ESI only)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.gui-scripts]
evekonta = "evekonta.gui:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["evekonta"]

[tool.setuptools.dynamic]
version = { attr = "evekonta.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "UP017"]  # Polish text is intentional; timezone.utc reads fine
